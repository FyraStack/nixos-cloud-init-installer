name: "Build Proxmox cloud image and create GitHub Release draft for new versions"

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the image filename (e.g. v1.0.0-test)"
        required: false
        default: "dev"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install Nix"
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:26.05
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm uid-range
            download-attempts = 10
            http-connections = 8
            stalled-download-timeout = 300
      - name: Determine version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine image package
        id: image-package
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "package=qcow2-compressed" >> "$GITHUB_OUTPUT"
          else
            echo "package=qcow2" >> "$GITHUB_OUTPUT"
          fi
      - name: Build QCOW2 image
        run: nix build .#${{ steps.image-package.outputs.package }}
      - name: Copy QCOW2 image
        run: |
          cp result/*.qcow2 nixos-cloud-proxmox-${{ steps.version.outputs.version }}-x86_64.qcow2
      - name: Check image size
        run: |
          ls -lh nixos-cloud-proxmox-${{ steps.version.outputs.version }}-x86_64.qcow2
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qcow2-artifact-x86_64
          path: nixos-cloud-proxmox-${{ steps.version.outputs.version }}-x86_64.qcow2
  create-release:
    needs: build
    runs-on: ubuntu-latest
    # Only create a release on tag pushes, not manual runs
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: qcow2-artifacts
          pattern: qcow2-artifact-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          files: qcow2-artifacts/*.qcow2
